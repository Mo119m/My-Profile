<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reading — Moshi Fu</title>
  <meta name="description" content="Papers Moshi Fu has read." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz@0,6..72;1,6..72&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
    <span class="theme-toggle__icon">◐</span>
  </button>

  <main class="container container--wide">
    <header class="header header--sub">
      <a href="index.html" class="home-link">Moshi Fu</a>
      <nav class="nav">
        <a href="index.html">About</a>
        <a href="notes.html">Notes</a>
        <a href="publications.html">Publications</a>
        <a href="projects.html">Projects</a>
        <a href="problems.html">Problems</a>
        <a href="reading.html" class="is-active">Reading</a>
        <a href="blog.html">Blog</a>
      </nav>
    </header>

    <section class="section">
      <h2 class="section-title">Reading</h2>
      <p>Papers I've read. Type to filter, or click a column header to sort.</p>

      <input
        id="paper-search"
        class="search-box"
        type="search"
        placeholder="Search papers…"
        aria-label="Search papers"
      />

      <table class="papers" id="papers-table">
        <thead>
          <tr>
            <th data-sort="title"><span class="arrow">Title</span></th>
            <th data-sort="source" class="col-source"><span class="arrow">Source</span></th>
            <th data-sort="published" class="col-pub"><span class="arrow">Published</span></th>
            <th data-sort="tags"><span class="arrow">Tags</span></th>
          </tr>
        </thead>
        <!--
          Each <tr class="paper"> is one paper. data-read is the date you read
          it (used for grouping/sorting); data-published is the paper's date.
          Add new rows by copying the example below.
        -->
        <tbody>
          <tr class="paper" data-read="2026-06-01" data-published="2017-06-12">
            <td><a class="paper-title" href="https://arxiv.org/abs/1706.03762" target="_blank" rel="noopener">Attention Is All You Need</a></td>
            <td class="col-source">arXiv</td>
            <td class="col-pub">2017-06-12</td>
            <td><span class="tag">ML</span><span class="tag">NLP</span></td>
          </tr>
        </tbody>
      </table>

      <p class="empty-note" id="no-results" style="display:none">No papers match your search.</p>
    </section>

    <footer class="footer">
      <p>© <span id="year"></span> Moshi Fu</p>
    </footer>
  </main>

  <script src="assets/main.js"></script>
  <script src="assets/reading.js"></script>
</body>
</html>
